services:
  - type: web
    name: istat-press-releases-api
    runtime: python
    plan: free
    region: frankfurt
    # La root resta la radice del repo, cosi' la cartella db/ e' inclusa
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --app-dir api --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
