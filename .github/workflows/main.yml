name: Copyscape Check

on:
  workflow_dispatch:        # esecuzione manuale dal tab Actions
   

permissions:
  contents: write            # necessario per fare push dei file di output

jobs:
  run-copyscape-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pandas

      - name: Run copyscape_check.py
        run: python copyscape_check.py --input get_print_reviews.csv
        env:
          COPYSCAPE_USERNAME: ${{ secrets.COPYSCAPE_USERNAME }}
          COPYSCAPE_API_KEY: ${{ secrets.COPYSCAPE_API_KEY }}

      - name: Commit and push output files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add copyscape_results_*.csv copyscape_log.csv
          git diff --staged --quiet || git commit -m "Aggiorna output copyscape_check.py [skip ci]"
          git push
