name: Pipeline serale

on:
  schedule:
    # Cron in UTC: 18:00 UTC = 20:00 ora legale italiana (CEST)
    - cron: "0 18 * * *"
  workflow_dispatch: {}   # permette anche l'avvio manuale dalla tab Actions

permissions:
  contents: write         # serve per committare i risultati

concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installa dipendenze
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Esegui pipeline
        env:
          COPYSCAPE_USERNAME: ${{ secrets.COPYSCAPE_USERNAME }}
          COPYSCAPE_API_KEY: ${{ secrets.COPYSCAPE_API_KEY }}
          TZ: Europe/Rome
        run: python run_pipeline.py --filter filter.txt

      - name: Commit dei risultati
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add -A -- . ':!__pycache__'
          if git diff --cached --quiet; then
            echo "Nessuna modifica da committare"
          else
            git commit -m "Aggiornamento pipeline $(date +'%Y-%m-%d %H:%M')"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
